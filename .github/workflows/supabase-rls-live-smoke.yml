name: Supabase RLS live smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supabase-rls-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest 'psycopg[binary]>=3.2,<4'
      - name: Execute entitlement migrations and verify RLS boundary
        env:
          NEXTLAW_SUPABASE_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest -q compat/test_supabase_rls_live_smoke.py
