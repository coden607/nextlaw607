name: Langfuse live export smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langfuse-live-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      NEXTLAW_EXACT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate protected provider configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LANGFUSE_PUBLIC_KEY"
          test -n "$LANGFUSE_SECRET_KEY"
          case "$LANGFUSE_BASE_URL" in
            https://*) ;;
            *) echo "LANGFUSE_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$NEXTLAW_EXACT_REVISION"

      - name: Install exact observability runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[observability]' pytest

      - name: Export sanitized event and verify provider readback
        run: pytest -q compat/test_langfuse_live_smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langfuse-live-evidence-${{ github.sha }}
          path: langfuse-live-evidence.json
          if-no-files-found: warn
