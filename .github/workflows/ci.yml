name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: python -m pip install --upgrade pip
      - run: pip install -e . fastapi uvicorn httpx pytest
      - run: npm --prefix apps/web install --no-audit --no-fund
      - run: ./scripts/verify.sh

  production-readiness-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Write exact-revision readiness report
        env:
          NEXTLAW_EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/production-readiness-check.py > production-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: production-readiness.json
          if-no-files-found: error

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build exact-revision image
        run: docker build --pull -t "nextlaw607:${GITHUB_SHA}" .
      - name: Run non-root container and probe static runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name nextlaw607-smoke \
            -p 127.0.0.1:4173:4173 \
            -e NEXTLAW_API_ORIGIN=https://api.example.invalid \
            "nextlaw607:${GITHUB_SHA}"
          trap 'docker logs nextlaw607-smoke || true; docker rm -f nextlaw607-smoke >/dev/null 2>&1 || true' EXIT
          test "$(docker inspect -f '{{.Config.User}}' nextlaw607-smoke)" = "nextlaw"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/tmp/nextlaw-index.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/manifest.webmanifest >/tmp/nextlaw-manifest.webmanifest
          grep -q 'NextLaw' /tmp/nextlaw-index.html
          health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' nextlaw607-smoke)"
          test "$health" != "unhealthy"

  cloudflare-deploy-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/web install --no-audit --no-fund
      - run: npm --prefix apps/web run build
      - name: Wrangler exact-revision dry run
        run: npx --yes wrangler@4.68.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Assert deploy bundle exists
        run: test -n "$(find .wrangler-dry-run -type f -maxdepth 2 -print -quit)"

  agent-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[agents]' pytest
      - run: pytest -q compat/test_agent_frameworks.py

  ingestion-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[ingestion]' pytest
      - run: pytest -q compat/test_ingestion_frameworks.py

  ingestion-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[ingestion]' pytest
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q compat/test_ingestion_live_smoke.py

  pgvector-live-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest 'psycopg[binary]>=3.2,<4'
      - run: pytest -q compat/test_pgvector_live_smoke.py
        env:
          NEXTLAW_PGVECTOR_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  memory-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[memory]' pytest
      - run: pytest -q compat/test_memory_framework.py

  guardrails-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[guardrails]' pytest
      - run: pytest -q compat/test_guardrails_framework.py

  observability-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[observability]' pytest
      - run: pytest -q compat/test_observability_frameworks.py

  evaluation-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[evaluation]' pytest
      - run: pytest -q compat/test_evaluation_frameworks.py
      - name: Write exact-revision evaluation evidence
        run: |
          printf '{"schema_version":1,"revision":"%s","deterministic_gate":"required","framework_compat":"passed"}\n' "$GITHUB_SHA" > evaluation-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence-${{ github.sha }}
          path: evaluation-evidence.json
          if-no-files-found: error
