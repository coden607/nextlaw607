name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: python -m pip install --upgrade pip
      - run: pip install -e . fastapi uvicorn httpx pytest
      - run: npm --prefix apps/web install --no-audit --no-fund
      - run: ./scripts/verify.sh

  agent-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[agents]' pytest
      - run: pytest -q compat/test_agent_frameworks.py

  ingestion-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[ingestion]' pytest
      - run: pytest -q compat/test_ingestion_frameworks.py

  ingestion-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[ingestion]' pytest
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q compat/test_ingestion_live_smoke.py

  pgvector-live-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install pytest 'psycopg[binary]>=3.2,<4'
      - run: pytest -q compat/test_pgvector_live_smoke.py
        env:
          NEXTLAW_PGVECTOR_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  memory-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[memory]' pytest
      - run: pytest -q compat/test_memory_framework.py

  guardrails-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[guardrails]' pytest
      - run: pytest -q compat/test_guardrails_framework.py

  observability-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[observability]' pytest
      - run: pytest -q compat/test_observability_frameworks.py

  evaluation-framework-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[evaluation]' pytest
      - run: pytest -q compat/test_evaluation_frameworks.py
      - name: Write exact-revision evaluation evidence
        run: |
          printf '{"schema_version":1,"revision":"%s","deterministic_gate":"required","framework_compat":"passed"}\n' "$GITHUB_SHA" > evaluation-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence-${{ github.sha }}
          path: evaluation-evidence.json
          if-no-files-found: error
