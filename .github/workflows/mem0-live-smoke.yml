name: Mem0 live smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mem0-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
      NEXTLAW_EXACT_REVISION: ${{ github.sha }}
      NEXTLAW_MEM0_TEST_SCOPE: nextlaw607-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[memory]' pytest
      - name: Require protected Mem0 provider credential
        shell: bash
        run: test -n "$MEM0_API_KEY"
      - name: Verify provider-backed scope isolation, deletion, and re-query
        run: pytest -q compat/test_mem0_live_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mem0-live-evidence-${{ github.sha }}
          path: mem0-live-evidence.json
          if-no-files-found: warn
