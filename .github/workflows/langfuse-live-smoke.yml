name: Langfuse live smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Langfuse live smoke through production telemetry adapter
        shell: bash
        run: |
          set -eu
          if [ -z "${LANGFUSE_PUBLIC_KEY:-}" ] || [ -z "${LANGFUSE_SECRET_KEY:-}" ]; then
            echo "Langfuse provider credentials are not configured; live verification remains blocked."
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -e '.[observability]'
          python - <<'PY'
          from langfuse import get_client
          from nextlaw607.telemetry import LangfuseSink, PrivacySafeTelemetry

          client = get_client()
          telemetry = PrivacySafeTelemetry([LangfuseSink(client=client)])
          event = telemetry.emit(
              name="nextlaw.live_smoke",
              correlation_id="ci-langfuse-live-smoke",
              attributes={"provider": "langfuse", "authority_eligible": False},
          )
          assert event.attributes["authority_eligible"] is False
          assert telemetry.sink_failures == 0
          flush = getattr(client, "flush", None)
          if callable(flush):
              flush()
          PY
