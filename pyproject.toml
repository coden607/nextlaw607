[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextlaw607-core"
version = "0.2.0"
description = "Verified legal workflow core for NextLaw607"
requires-python = ">=3.9"

[project.optional-dependencies]
agents = [
  "pydantic-ai>=1.0",
  "langgraph>=1.0",
]
ingestion = [
  "docling>=2.0",
  "crawl4ai>=0.9,<1",
]
memory = [
  "mem0ai>=2.0,<3; python_version >= '3.10'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
