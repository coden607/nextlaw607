[app]
name = "NextLaw607"
domain = "legal"
version = "0.2.0"
profile = "ai"

[development]
method = "continuity-hybrid"
roles = ["platform-steward", "architect", "security", "developer", "qa", "legal-domain-expert", "citation-verifier"]
architecture_gate = true
security_gate = true
eval_gate = true

[quality]
min_quality = 0.95
min_reliability = 0.97
prefer_zero_token = true
escalation = ["deterministic", "local_free", "economical", "premium", "council"]

[verification]
gates = ["compile", "tests", "typecheck", "security", "privacy", "architecture", "evals", "e2e", "accessibility", "performance", "pwa"]

[verification.commands]
compile = "python3 -m compileall -q src services"
tests = "./scripts/verify-python.sh"
typecheck = "./scripts/verify-web.sh"
security = "python3 scripts/security-check.py"
privacy = "npm --prefix apps/web test"
architecture = "python3 scripts/architecture-check.py"
evals = "PYTHONPATH=. python3 -m pytest -q tests/test_rules_evals.py"
e2e = "PYTHONPATH=src:. python3 -m pytest -q tests/test_local_e2e.py"
pwa = "python3 scripts/pwa-check.py"

[verification.performance_budgets]
lcp_ms = 2500
cls = 0.1
inp_ms = 200

[features]
pwa = true
api = true
voice = true
memory = true

[deployment]
targets = ["github", "vercel"]
secrets = ["COURTLISTENER_API_TOKEN", "OPENAI_API_KEY"]
